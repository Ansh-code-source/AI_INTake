name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q

  integration-qdrant:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      qdrant:
        image: qdrant/qdrant:v1.2.0
        ports:
          - 6333:6333
        options: >
          --health-cmd="curl -f http://localhost:6333/health || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:6333/health && break || sleep 1
          done
      - name: Install integration deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' langchain_qdrant langchain_openai qdrant-client openai
      - name: Run Qdrant integration tests
        env:
          RUN_QDRANT_INTEGRATION: '1'
        run: pytest tests/test_qdrant_wrapper.py::test_qdrant_wrapper_from_documents_integration -q
