name: py-client CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/py_client
          python -m pip install pytest
      - name: Run tests
        run: pytest packages/py_client -q
